services:
  - type: web
    name: home-visit-system
    runtime: docker
    repo: https://github.com/your-username/home-visit-standalone
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: home-visit-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: UPLOAD_DIR
        value: /app/uploads
    disk:
      name: uploads
      mountPath: /app/uploads
      sizeGB: 1

databases:
  - name: home-visit-db
    plan: free
    databaseName: home_visit
    user: home_visit_user
